# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html

server.port=8083
spring.application.name=kakfa-service
spring.profiles.active=kafka_test

spring.boot.base.url=http://localhost:8081/api/help

spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

# Kafka server
spring.kafka.bootstrap-servers=localhost:9092

## Producer
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Topic
spring.kafka.topic.name=help-topic
# Consumer
spring.kafka.consumer.group-id=help-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# error handling
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=com.org.help.kafka.entity
#spring.kafka.consumer.properties.spring.json.value.default.type=com.org.help.kafka.entity.HelpEntity


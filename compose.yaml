services:
  config-server:
    build: ./config-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8888:8888"
    networks:
      - microservices-parent-network


  eureka-server:
    build: ./eureka-server-service-discovery
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server-service-discovery
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      - config-server
    networks:
      - microservices-parent-network


  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: 
      - "9000:9000"
    networks:
      - microservices-parent-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    ports: 
     - "8180:8080"
     - "9002:9000"
    healthcheck:
      test:
       - CMD
       - bash
       - -c
       - "echo > /dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    networks:
      - microservices-parent-network



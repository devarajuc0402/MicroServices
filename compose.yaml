services:
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    networks:
      - microservices-parent-network


  eureka-server:
    build: ./eureka-server-service-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://localhost:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server-service-discovery:8761/eureka/"
    depends_on:
      - config-server
    networks:
      - microservices-parent-network


  redis:
    image: redis:7-alpine
    ports: 
      - "9001:9001"
    networks:
      - microservices-parent-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    ports: 
      - "9002:9002"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    networks:
      - microservices-parent-network


  help-service:
    build: ./help-service
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://localhost:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server-service-discovery:8761/eureka/"
      SPRING_KAFKA-BOOTSTRAP_SERVERS: "host.docker.internal:9000"
    depends_on:
      - config-server
      - eureka-server
      - redis
      - keycloak
    networks:
      - microservices-parent-network


  restclient-service:
    build: ./restclient-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server-service-discovery:8761/eureka/"
    depends_on:
      - config-server
      - eureka-server
    networks:
      - microservices-parent-network


  kafka-service:
    build: ./kafka-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      - config-server
      - eureka-server
    networks:
      - microservices-parent-network

  api-gateway:
    build: ./eureka-client-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      - config-server
      - eureka-server
      - help-service
      - restclient-service
      - redis
    networks:
      - microservices-parent-network


networks:
  microservices-parent-network:
    driver: bridge
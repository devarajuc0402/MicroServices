  api-gateway:
    build: ./eureka-client-api-gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: eureka-client-api-gateway
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - microservices-parent-network


networks:
  microservices-parent-network:
    driver: bridge
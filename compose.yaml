services:
  config-server:
    build: ./config-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8888:8888"
    networks:
      - microservices-parent-network


  eureka-server:
    build: ./eureka-server-service-discovery
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server-service-discovery
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - microservices-parent-network


  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: 
      - "6379:6379"
    networks:
      - microservices-parent-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    ports: 
      - "8180:8080"
    healthcheck:
      test:
       - CMD
       - bash
       - -c
       - "echo > /dev/tcp/127.0.0.1/8080"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - microservices-parent-network


  help-service:
    build: ./help-service
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://localhost:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/microservices
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/microservices/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - microservices-parent-network

